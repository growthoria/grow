<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Growthoria Admin</title><style>
body{margin:0;background:#080604;color:#fff;font-family:Arial,sans-serif}.wrap{max-width:1180px;margin:auto;padding:24px}h1{font-size:34px}button,a{border:1px solid #ff7a1a;border-radius:12px;background:#19100b;color:#fff;padding:12px 16px;text-decoration:none;cursor:pointer}.primary{background:#ff6a00}.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0}.tabs button.active{background:#ff6a00}.panel{border:1px solid rgba(255,122,26,.25);border-radius:22px;padding:20px;background:rgba(255,255,255,.04)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:grid;gap:6px}.full{grid-column:1/-1}label{color:#ff7a1a;font-size:12px;text-transform:uppercase;letter-spacing:.1em}input,textarea{width:100%;border:1px solid rgba(255,255,255,.15);border-radius:12px;background:#0d0907;color:#fff;padding:12px;font:inherit}textarea{min-height:100px}.service{border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:14px;margin:14px 0}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.json{min-height:500px;font-family:monospace}.status{color:rgba(255,255,255,.65)}@media(max-width:760px){.grid{grid-template-columns:1fr}.wrap{padding:14px}}</style></head><body><div class="wrap"><h1>Growthoria Admin</h1><p class="status" id="status">Loading...</p><div class="actions"><a href="../index.html" target="_blank">Open site</a><button class="primary" id="saveTop">Save changes</button></div><div class="tabs" id="tabs"></div><div class="panel"><div id="editor"></div><div class="actions"><button class="primary" id="saveBottom">Save changes</button><button id="addService">Add service</button><button id="exportBtn">Export JSON</button><button id="importBtn">Import JSON</button><button id="resetBtn">Reset</button></div></div></div><script src="../assets/site-content.js"></script><script src="admin.js"></script></body></html>
