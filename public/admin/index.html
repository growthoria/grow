<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Growthoria Admin</title>
  <style>
    body{margin:0;background:radial-gradient(circle at 0 0,rgba(255,122,26,.16),transparent 32%),#080604;color:#fff;font-family:Arial,sans-serif}
    .wrap{max-width:1180px;margin:auto;padding:24px}
    h1{font-size:34px;margin:0 0 8px}
    button,a{border:1px solid #ff7a1a;border-radius:12px;background:#19100b;color:#fff;padding:12px 16px;text-decoration:none;cursor:pointer}
    .primary{background:#ff6a00}
    .tabs{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0}
    .tabs button.active{background:#ff6a00}
    .panel{border:1px solid rgba(255,122,26,.25);border-radius:22px;padding:20px;background:rgba(255,255,255,.04)}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .field{display:grid;gap:6px}
    .full{grid-column:1/-1}
    label{color:#ff7a1a;font-size:12px;text-transform:uppercase;letter-spacing:.1em}
    input,textarea{width:100%;border:1px solid rgba(255,255,255,.15);border-radius:12px;background:#0d0907;color:#fff;padding:12px;font:inherit;box-sizing:border-box}
    textarea{min-height:100px}
    .service{border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:14px;margin:14px 0}
    .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
    .json{min-height:500px;font-family:monospace}
    .status{color:rgba(255,255,255,.65)}
    .login{min-height:100vh;display:grid;place-items:center;padding:20px}
    .login-card{width:min(460px,100%);border:1px solid rgba(255,122,26,.28);border-radius:26px;padding:28px;background:linear-gradient(145deg,rgba(255,255,255,.06),rgba(255,255,255,.015));box-shadow:0 30px 90px rgba(0,0,0,.45)}
    .login-card p{color:rgba(255,255,255,.62);line-height:1.5}
    .login-card input{margin:8px 0 14px}
    .hidden{display:none!important}
    header{display:flex;align-items:flex-start;justify-content:space-between;gap:18px}
    @media(max-width:760px){.grid{grid-template-columns:1fr}.wrap{padding:14px}header{flex-direction:column}}
  </style>
</head>
<body>
  <section id="loginScreen" class="login">
    <div class="login-card">
      <h1>Growthoria Admin</h1>
      <p>Enter your admin password once. It will be saved in this browser so you do not need to enter it every time you save changes.</p>
      <label>Admin password</label>
      <input id="loginPassword" type="password" placeholder="Enter admin password" autocomplete="current-password">
      <div class="actions">
        <button class="primary" id="loginBtn">Login</button>
        <a href="../index.html">Back to site</a>
      </div>
      <p class="status" id="loginStatus"></p>
    </div>
  </section>

  <section id="adminScreen" class="wrap hidden">
    <header>
      <div>
        <h1>Growthoria Admin</h1>
        <p class="status" id="status">Loading...</p>
      </div>
      <div class="actions">
        <a href="../index.html" target="_blank">Open site</a>
        <button id="logoutBtn">Logout</button>
        <button class="primary" id="saveTop">Save changes</button>
      </div>
    </header>

    <div class="tabs" id="tabs"></div>
    <div class="panel">
      <div id="editor"></div>
      <div class="actions">
        <button class="primary" id="saveBottom">Save changes</button>
        <button id="addService">Add service</button>
        <button id="exportBtn">Export JSON</button>
        <button id="importBtn">Import JSON</button>
        <button id="resetBtn">Reset</button>
      </div>
    </div>
  </section>

  <script src="../assets/site-content.js"></script>
  <script src="admin.js"></script>
</body>
</html>
